<!DOCTYPE html>
<html lang="pt">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FIT Analysis</title>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background: #f5f5f5;
        }

        .container {
            max-width: 1400px;
            margin: auto;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #filepath {
            flex: 1;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        .chart-container {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
        }

        .chart {
            width: 100%;
            height: 420px;
        }

        #status {
            margin-top: 10px;
            color: #555;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>FIT Analysis</h1>

    <div class="controls">

        <input
            id="filepath"
            type="text"
            placeholder="path to .fit"
        >

        <button id="loadButton">
            Load
        </button>

    </div>

    <div id="status"></div>


    <div id="charts" style="display: none;">

        <div class="chart-container">
            <h3>Power (W) over distance</h3>
            <div id="powerChart" class="chart"></div>
        </div>

        <div class="chart-container">
            <h3>Speed (km/h) over distance</h3>
            <div id="speedChart" class="chart"></div>
        </div>

        <div class="chart-container">
            <h3>Derivative Speed (km/h) over distance</h3>
            <div id="derivativeSpeedChart" class="chart"></div>
        </div>

        <div class="chart-container">
            <h3>Derivative Power (W) over distance</h3>
            <div id="derivativePowerChart" class="chart"></div>
        </div>

        <div class="chart-container">
            <h3>Lateral Acceleration (m/s²) over distance</h3>
            <div id="lateralChart" class="chart"></div>
        </div>

        <div class="chart-container">
            <h3>Longitudinal Acceleration (m/s²) over distance</h3>
            <div id="longChart" class="chart"></div>
        </div>

    </div>

</div>


<script>

let powerChart = null;
let speedChart = null;
let derivativeSpeedChart = null;
let derivativePowerChart = null;
let lateralChart = null;
let longChart = null;


/*
 * Flask endpoint
 */
const FLASK_API =
    "http://127.0.0.1:5000";


/*
 * Load data from Flask
 */
async function getPower() {

    const filepath =
        document.getElementById("filepath").value;

    const status =
        document.getElementById("status");


    if (!filepath) {

        status.innerText =
            "Please enter a FIT file path.";

        return;
    }


    status.innerText =
        "Loading...";


    try {

        const encodedPath =
            encodeURIComponent(filepath);


        const response = await fetch(
            `${FLASK_API}/api/potencia?path=${encodedPath}`
        );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );
        }


        const data =
            await response.json();


        console.log("Flask response:", data);


        if (!data.laps || !data.laps.length) {

            document.getElementById("charts")
                .style.display = "none";

            status.innerText =
                "No laps returned.";

            return;
        }


        status.innerText = "";

        document.getElementById("charts")
            .style.display = "block";


        renderPowerChart(data);

        renderSpeedChart(data);

        renderDerivativeSpeedChart(data);

        renderDerivativePowerChart(data);

        renderLateralChart(data);

        renderLongChart(data);

    }
    catch (error) {

        console.error(error);

        status.innerText =
            `Error: ${error.message}`;
    }
}


/*
 * Build ECharts series
 */
function buildSeries(data, metricKey) {

    return data.laps.map((lapObj) => {

        return {

            name: `Lap ${lapObj.lap}`,

            type: "line",

            showSymbol: false,

            data: lapObj.points
                .filter(
                    p =>
                        p.time != null &&
                        p[metricKey] != null
                )
                .map(
                    p => [
                        Number(p.time),
                        Number(p[metricKey])
                    ]
                )

        };

    });

}


/*
 * POWER
 */
function renderPowerChart(data) {

    const el =
        document.getElementById("powerChart");


    if (!powerChart) {
        powerChart = echarts.init(el);
    }


    const series =
        buildSeries(data, "power");


    const realPowerSeries =
        buildSeries(data, "realPower");


    series.forEach(s => {

        s.lineStyle = {
            width: 2
        };

        s.itemStyle = {
            color: "#5470C6"
        };

    });


    realPowerSeries.forEach(s => {

        s.lineStyle = {
            width: 2,
            type: "dashed"
        };

        s.itemStyle = {
            color: "#EE6666"
        };

    });


    powerChart.setOption({

        tooltip: {
            trigger: "axis"
        },

        legend: {
            top: 10
        },

        xAxis: {
            type: "value",
            name: "Time (s)"
        },

        yAxis: {
            type: "value",
            name: "Power (W)"
        },

        dataZoom: [
            {
                type: "inside"
            },
            {
                type: "slider"
            }
        ],

        series: [
            ...series,
            ...realPowerSeries
        ]

    }, true);


    powerChart.resize();
}


/*
 * SPEED
 */
function renderSpeedChart(data) {

    const el =
        document.getElementById("speedChart");


    if (!speedChart) {
        speedChart = echarts.init(el);
    }


    speedChart.setOption({

        tooltip: {
            trigger: "axis"
        },

        legend: {
            top: 10
        },

        xAxis: {
            type: "value",
            name: "Time (s)"
        },

        yAxis: {
            type: "value",
            name: "Speed"
        },

        dataZoom: [
            {
                type: "inside"
            },
            {
                type: "slider"
            }
        ],

        series:
            buildSeries(data, "speed")

    }, true);


    speedChart.resize();
}


/*
 * DERIVATIVE SPEED
 */
function renderDerivativeSpeedChart(data) {

    const el =
        document.getElementById(
            "derivativeSpeedChart"
        );


    if (!derivativeSpeedChart) {

        derivativeSpeedChart =
            echarts.init(el);
    }


    derivativeSpeedChart.setOption({

        tooltip: {
            trigger: "axis"
        },

        legend: {
            top: 10
        },

        xAxis: {
            type: "value",
            name: "Time (s)"
        },

        yAxis: {
            type: "value",
            name: "Derivative Speed"
        },

        dataZoom: [
            {
                type: "inside"
            },
            {
                type: "slider"
            }
        ],

        series:
            buildSeries(
                data,
                "derivativeSpeed"
            )

    }, true);


    derivativeSpeedChart.resize();
}


/*
 * DERIVATIVE POWER
 */
function renderDerivativePowerChart(data) {

    const el =
        document.getElementById(
            "derivativePowerChart"
        );


    if (!derivativePowerChart) {

        derivativePowerChart =
            echarts.init(el);
    }


    derivativePowerChart.setOption({

        tooltip: {
            trigger: "axis"
        },

        legend: {
            top: 10
        },

        xAxis: {
            type: "value",
            name: "Time (s)"
        },

        yAxis: {
            type: "value",
            name: "Derivative Power (W/s)"
        },

        dataZoom: [
            {
                type: "inside"
            },
            {
                type: "slider"
            }
        ],

        series:
            buildSeries(
                data,
                "derivativePower"
            )

    }, true);


    derivativePowerChart.resize();
}


/*
 * LATERAL
 */
function renderLateralChart(data) {

    const el =
        document.getElementById("lateralChart");


    if (!lateralChart) {

        lateralChart =
            echarts.init(el);
    }


    lateralChart.setOption({

        tooltip: {
            trigger: "axis"
        },

        legend: {
            top: 10
        },

        xAxis: {
            type: "value",
            name: "Time (s)"
        },

        yAxis: {
            type: "value",
            name: "Lateral (m/s²)"
        },

        dataZoom: [
            {
                type: "inside"
            },
            {
                type: "slider"
            }
        ],

        series:
            buildSeries(
                data,
                "lateral"
            )

    }, true);


    lateralChart.resize();
}


/*
 * LONGITUDINAL
 */
function renderLongChart(data) {

    const el =
        document.getElementById("longChart");


    if (!longChart) {

        longChart =
            echarts.init(el);
    }


    longChart.setOption({

        tooltip: {
            trigger: "axis"
        },

        legend: {
            top: 10
        },

        xAxis: {
            type: "value",
            name: "Time (s)"
        },

        yAxis: {
            type: "value",
            name: "Longitudinal (m/s²)"
        },

        dataZoom: [
            {
                type: "inside"
            },
            {
                type: "slider"
            }
        ],

        series:
            buildSeries(
                data,
                "long"
            )

    }, true);


    longChart.resize();
}


/*
 * Button
 */
document
    .getElementById("loadButton")
    .addEventListener(
        "click",
        getPower
    );


/*
 * Enter
 */
document
    .getElementById("filepath")
    .addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                getPower();
            }

        }
    );


/*
 * Resize
 */
window.addEventListener(
    "resize",
    () => {

        powerChart?.resize();

        speedChart?.resize();

        derivativeSpeedChart?.resize();

        derivativePowerChart?.resize();

        lateralChart?.resize();

        longChart?.resize();

    }
);

</script>

</body>
</html>
